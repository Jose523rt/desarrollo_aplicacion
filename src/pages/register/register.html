<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
</head>
<body>
    <div class="card">

      <div class="card-body">
        <div class="test-center">
          <img src="../../../recursos/Kduco_logo.png" alt="Logo de Kduco" class="logoKduco">
        </div>
        <h1 class="card-tittle">Registro</h1>
        <!--<div class="row" id="rowTittle">
          <h6>¿No tienes una cuenta?</h6>
          <h6>Registrate aquí</h6>
        </div>-->
        <div class="row">
          <div class="mb-3">
            <label for="user" class="form-label">Nombre de usuario</label>
            <input id="registerUser" type="text" class="form-control" required>
          </div>
          <div class="mb-4">
            <label for="email" class="form-label">Correo electrónico</label>
            <input id="registerEmail" type="email" class="form-control" placeholder="email@example.com" required>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input id="registerPassword" type="password" class="form-control" required>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Confirmar contraseña</label>
            <input id="confirmPassword" type="password" class="form-control" required>
          </div>
          <div>
            <button id="btnRegister" type="button" class="btn btn-primary m-0">Registrarse</button>
            <button id="btnTest" type="button" class="btn test">test</button>
          </div>
        </div>
      </div>
    </div> 
</body>
</html>
